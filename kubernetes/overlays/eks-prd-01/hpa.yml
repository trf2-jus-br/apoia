apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apoia-hpa
  namespace: negociais
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apoia
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75